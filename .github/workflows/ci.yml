name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        command: [format:check, lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @falcon/database prisma:generate
      - run: pnpm ${{ matrix.command }}

  database:
    name: Prisma and migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine3.21
        env:
          POSTGRES_DB: falcon
          POSTGRES_USER: falcon
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U falcon -d falcon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://falcon:ci_only_password@localhost:5432/falcon?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @falcon/database prisma:format
      - run: pnpm --filter @falcon/database prisma:validate
      - run: pnpm --filter @falcon/database prisma:generate
      - run: pnpm --filter @falcon/database exec prisma migrate deploy --config prisma.config.ts
      - name: Verify append-only triggers and baseline tables
        run: |
          PGPASSWORD=ci_only_password psql -h localhost -U falcon -d falcon -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.process_instances') IS NOT NULL AS process_instances_exists;
          SELECT to_regclass('public.activity_logs') IS NOT NULL AS activity_logs_exists;
          SELECT tgname FROM pg_trigger WHERE tgname IN ('activity_logs_append_only', 'system_audit_logs_append_only');
          SQL

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The deploy build, never pushed. `pnpm build` has gone green twice while
      # this was broken: once when a prune step emptied apps/api/node_modules,
      # once when .dockerignore dropped docs/guides. The flags match the deploy
      # command in docs/operations/deployment.md. The organization UUID is a
      # placeholder, since nothing here serves the bundle to a browser.
      - name: Build the image
        run: >-
          docker build
          --provenance=false
          --sbom=false
          --build-arg VITE_FALCON_ORGANIZATION_ID=00000000-0000-4000-8000-000000000000
          --tag falcon-crm:ci
          .
      # A clean build is not enough on its own. The pruned image built without
      # error and failed only at startup, when node could not resolve fastify.
      # Booting it catches that. No database is needed, because the API connects
      # lazily and /health does not touch it.
      - name: Boot the image and check /health
        run: |
          docker run --detach --name falcon-crm-ci --publish 3000:3000 \
            --env FALCON_DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci \
            --env FALCON_HTTP_PORT=3000 \
            --env FALCON_CORS_ORIGIN=http://localhost:3000 \
            --env FALCON_LOG_LEVEL=info \
            --env FALCON_SESSION_COOKIE_SECURE=false \
            falcon-crm:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000/health \
              && curl --fail --silent --output /dev/null http://localhost:3000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs falcon-crm-ci
          exit 1

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.4
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate environment roots
        run: |
          for environment in dev staging production; do
            terraform -chdir="infra/terraform/environments/$environment" init -backend=false
            terraform -chdir="infra/terraform/environments/$environment" validate
          done
